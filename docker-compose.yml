services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./storage:/app/storage"]
  ui:
    build: .
    env_file: .env
    environment:
      - API_URL=http://api:8000
    command: streamlit run app/ui.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    depends_on: [api]
